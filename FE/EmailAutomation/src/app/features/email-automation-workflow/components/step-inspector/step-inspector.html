<div class="inspector-card" *ngIf="node">
  <div class="inspector-header">
    <h4>Step Inspector: {{ node.title }}</h4>
  </div>

  <!-- Running: the detail line carries the spinner, so the panel the reviewer is
       reading is also the thing telling them the step is still working. -->
  <p class="inspector-detail running" *ngIf="node.busy">
    <span class="wf-spinner"></span>
    <span>{{ node.detail || 'Working…' }}</span>
  </p>

  <p class="inspector-detail" *ngIf="!node.busy && node.detail">{{ node.detail }}</p>

  <div class="meta-table" *ngIf="node.meta">
    <div class="meta-row" *ngFor="let item of node.meta | keyvalue">
      <span class="meta-key">{{ item.key }}:</span>
      <span class="meta-val">{{ item.value }}</span>
    </div>
  </div>

  <!-- Pipeline is stopped here by an earlier step -->
  <div class="inspector-blocked" *ngIf="node.blockedBy">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <span>Blocked by {{ node.blockedBy }}</span>
  </div>

  <!-- The one action that advances this node, when there is one -->
  <div class="inspector-primary-action" *ngIf="node.primaryAction">
    <button class="insp-btn primary" (click)="onPrimaryAction()">
      {{ node.primaryAction.label }}
    </button>
  </div>

</div>

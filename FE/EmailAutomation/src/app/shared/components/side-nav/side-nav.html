<nav class="side-nav" [class.collapsed]="collapsed" aria-label="Main menu">
  <button
    type="button"
    class="side-nav-toggle"
    (click)="toggle()"
    [attr.aria-expanded]="!collapsed"
    [attr.aria-label]="collapsed ? 'Expand menu' : 'Collapse menu'"
    [attr.data-tooltip]="collapsed ? 'Expand menu' : null"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="6" x2="20" y2="6"></line>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="18" x2="20" y2="18"></line>
    </svg>
    <span class="side-nav-label side-nav-title">Menu</span>
  </button>

  <div class="side-nav-items">
    <button
      *ngIf="showNewDashboard"
      type="button"
      class="side-nav-item"
      [class.active]="active === 'new-dashboard'"
      [attr.aria-current]="active === 'new-dashboard' ? 'page' : null"
      (click)="go('new-dashboard')"
      aria-label="New Dashboard"
      data-tooltip="New Dashboard"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-7 9 7"></path>
        <path d="M5 10v10h14V10"></path>
        <path d="M10 20v-6h4v6"></path>
      </svg>
      <span class="side-nav-label">New Dashboard</span>
    </button>

    <button
      type="button"
      class="side-nav-item"
      [class.active]="active === 'automation'"
      [attr.aria-current]="active === 'automation' ? 'page' : null"
      (click)="go('automation')"
      aria-label="Ticket Automation"
      data-tooltip="Ticket Automation"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <polyline points="3 7 12 13 21 7"></polyline>
      </svg>
      <span class="side-nav-label">Ticket Automation</span>
    </button>
  </div>

  <button type="button" class="side-nav-item side-nav-logout" (click)="logout()" aria-label="Logout" data-tooltip="Logout">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span class="side-nav-label">Logout</span>
  </button>
</nav>

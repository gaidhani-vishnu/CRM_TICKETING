<button
  type="button"
  class="account-menu-trigger"
  [class.open]="isOpen"
  [class.compact]="compact"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen"
  aria-haspopup="menu"
  [attr.aria-label]="(user?.employeeName || user?.username) + ', ' + roleLabel"
  [title]="(user?.employeeName || user?.username) + ' — ' + roleLabel"
>
  <span class="account-avatar">{{ initials }}</span>

  <span class="account-labels">
    <span class="account-name">{{ user?.employeeName || user?.username }}</span>
    <span class="account-role">{{ roleLabel }}</span>
  </span>

  <svg *ngIf="!compact" class="account-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
</button>

<div class="account-menu" *ngIf="isOpen" role="menu">
  <button type="button" class="account-menu-item" role="menuitem" (click)="openProfile()">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path>
    </svg>
    <span>My Profile</span>
  </button>

  <button type="button" class="account-menu-item logout" role="menuitem" (click)="logout()">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Logout</span>
  </button>
</div>

<app-profile-modal *ngIf="showProfileModal" [user]="user" (closed)="closeProfile()"></app-profile-modal>

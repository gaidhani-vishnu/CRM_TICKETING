<button
  type="button"
  class="user-filter-trigger"
  [class.open]="isOpen"
  [disabled]="disabled"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen"
  aria-haspopup="listbox"
  aria-label="CRM Executive"
  title="CRM Executive"
>
  <span class="user-avatar" [class.everyone]="selected === ALL_USERS">
    <ng-container *ngIf="initials; else everyoneIcon">{{ initials }}</ng-container>
    <ng-template #everyoneIcon>
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
      </svg>
    </ng-template>
  </span>

  <span class="user-name">{{ label }}</span>

  <svg class="user-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
</button>

<div class="user-filter-menu" *ngIf="isOpen" role="listbox">
  <button
    type="button"
    class="user-option"
    *ngFor="let option of options; trackBy: trackByValue"
    role="option"
    [attr.aria-selected]="selected === option.value"
    [class.selected]="selected === option.value"
    (click)="select(option.value)"
  >
    <span class="user-avatar" [class.everyone]="option.value === ALL_USERS">
      <ng-container *ngIf="option.initials; else rowEveryoneIcon">{{ option.initials }}</ng-container>
      <ng-template #rowEveryoneIcon>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
        </svg>
      </ng-template>
    </span>

    <span class="user-option-name">{{ option.label }}</span>
    <span class="user-option-count">{{ option.count }}</span>

    <svg class="user-option-tick" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </button>

  <span class="user-option-empty" *ngIf="!options.length">No thread has loaded yet.</span>
</div>
